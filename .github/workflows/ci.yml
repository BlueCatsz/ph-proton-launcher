name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check shell scripts syntax
        run: bash -n install.sh uninstall.sh

      - name: Install headless Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libdbus-1-3

      - name: Install Python dependencies
        run: python3 -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit and headless GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests -v
